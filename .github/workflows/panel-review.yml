name: "AI Agent Panel Review"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  panel-review:
    name: "Run Panel Review"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Panel Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 -m panel_review.cli review --path . --output-md panel_review_report.md --output-sarif panel_review.sarif

      - name: Publish Summary to Job
        if: always()
        run: |
          if [ -f panel_review_report.md ]; then
            cat panel_review_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: panel_review.sarif
        continue-on-error: true
